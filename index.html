<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-content">
        <div class="header-left">
          <h1>📋 Task Manager Pro</h1>
          <p>Gerenciamento Inteligente de Tarefas</p>
        </div>
        <button id="themeToggle" autocomplete="off">🌙 Dark Mode</button>
      </div>
    </header>

    <section class="dashboard">
      <div class="dashboard-card">
        <h3>Total de Tarefas</h3>
        <span id="totalTasks">0</span>
      </div>
      <div class="dashboard-card">
        <h3>Alta Prioridade</h3>
        <span id="highPriority">0</span>
      </div>
      <div class="dashboard-card">
        <h3>Vencendo Hoje</h3>
        <span id="dueToday">0</span>
      </div>
    </section>

    <section class="form-section">
      <h2>Nova Tarefa</h2>
      <div class="form-grid" id="taskForm">
        <input type="text" id="title" placeholder="Título da tarefa" autocomplete="off">
        <input type="text" id="responsible" placeholder="Responsável" autocomplete="off">
        <input type="date" id="deadline">
        <select id="priority">
          <option value="Baixa">Baixa</option>
          <option value="Média">Média</option>
          <option value="Alta">Alta</option>
        </select>
        <button type="button" id="addTask">Adicionar Tarefa</button>
      </div>
    </section>

    <section class="search-section">
      <input type="text" id="searchInput" placeholder="🔍 Pesquisar tarefas..." autocomplete="off">
    </section>

    <section class="tasks-section">
      <h2>Lista de Tarefas</h2>
      <div id="taskContainer"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
